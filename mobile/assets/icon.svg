<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="3"/>

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="800 60" filter="url(#glow)"/>

  <!-- Central 'D' Monogram Symbol -->
  <path d="M 190 145 L 280 145 C 350 145 390 190 390 256 C 390 322 350 367 280 367 L 190 367 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Subtle Internal Accent Dot -->
  <circle cx="340" cy="256" r="16" fill="#10b981" filter="url(#glow)"/>
</svg>
